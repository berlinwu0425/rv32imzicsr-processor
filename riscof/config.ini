; 路徑以本檔所在目錄 (riscof/) 為基準。
; 執行前先在 repo 根目錄建好模擬器 obj_dir/Vcpu_tb (見 README)；
; spike 不在 PATH 上時，可在 [spike] 加上 PATH=<spike 所在目錄>。
[RISCOF]
ReferencePlugin=spike
ReferencePluginPath=spike
DUTPlugin=mycpu
DUTPluginPath=mycpu

[mycpu]
pluginpath=mycpu
ispec=mycpu/mycpu_isa.yaml
pspec=mycpu/mycpu_platform.yaml
dut_exe=../obj_dir/Vcpu_tb
target_run=1

[spike]
pluginpath=spike
